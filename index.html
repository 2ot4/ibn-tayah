<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الشيف ابن تايه - Ibn Tayah</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --card-border: #262626;
            --text-light: #f5f5f5;
            --text-muted: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            padding-bottom: 120px;
        }

        /* الهيدر الملكي */
        header { 
            background: rgba(20, 20, 20, 0.95); 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--gold-dark); 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }

        .logo-title {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--gold-primary);
        }

        .subtitle {
            color: var(--gold-light);
            font-size: 0.85rem;
            margin-top: 4px;
            opacity: 0.8;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        .category-header {
            font-size: 1.3rem;
            color: var(--gold-primary);
            margin: 25px 0 15px;
            font-family: 'Amiri', serif;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
        }

        /* الشبكة والبطاقات */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; 
        }

        .item-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 16px; 
            padding: 12px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .item-img { 
            width: 100%; 
            height: 110px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-bottom: 10px; 
        }

        .item-title { 
            font-weight: 700; 
            margin-bottom: 4px; 
            font-size: 0.95rem; 
            color: var(--text-light);
        }

        .item-price { 
            color: var(--gold-primary); 
            font-weight: 800; 
            margin-bottom: 12px; 
            font-size: 0.9rem;
        }

        .btn-add { 
            background: transparent;
            color: var(--gold-primary); 
            border: 1px solid var(--gold-primary); 
            padding: 8px 12px; 
            border-radius: 25px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.85rem;
        }

        .btn-add:active {
            background: var(--gold-primary);
            color: #000;
        }

        /* السلة الفاخرة */
        .cart-bar { 
            position: fixed; 
            bottom: 15px; 
            left: 15px; 
            right: 15px; 
            max-width: 770px;
            margin: 0 auto;
            background: #141414; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--gold-primary); 
            border-radius: 50px;
            z-index: 100; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        .cart-info { display: flex; align-items: center; gap: 12px; }
        .cart-icon-wrapper { position: relative; color: var(--gold-primary); font-size: 1.3rem; }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .total-label { font-size: 0.75rem; color: var(--text-muted); }
        .total-amount { color: var(--gold-light); font-weight: 900; font-size: 1.05rem; }

        .btn-order { 
            background: #25d366; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        /* نافذة تفاصيل السلة Modal */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .cart-modal.active { display: flex; }

        .modal-content {
            background: #141414;
            border: 1px solid var(--gold-primary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 800px;
            max-height: 70vh;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-title { font-family: 'Amiri', serif; color: var(--gold-primary); font-size: 1.3rem; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn {
            background: var(--card-border);
            color: var(--gold-primary);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn { color: #ef4444; background: none; border: none; cursor: pointer; margin-right: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">مطعم الشيف ابن تايه</h1>
        <p class="subtitle">بغداد حي البساتين • LUXURY MENU</p>
    </header>

    <div class="container">
        <!-- قسم الوجبات -->
        <div>
            <h2 class="category-header"><i class="fas fa-crown"></i> الوجبات الرئيسية</h2>
            <div class="menu-grid">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=400" class="item-img" alt="قص لحم">
                    <div class="item-title">قص لحم عراقي</div>
                    <div class="item-price">8,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('قص لحم عراقي', 8000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" class="item-img" alt="برغر">
                    <div class="item-title">برغر لحم خاص</div>
                    <div class="item-price">6,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('برغر لحم خاص', 6000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=400" class="item-img" alt="شاورما">
                    <div class="item-title">شاورما دجاج</div>
                    <div class="item-price">5,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('شاورما دجاج', 5000)">+ إضافة</button>
                </div>
            </div>
        </div>

        <!-- قسم المشروبات -->
        <div>
            <h2 class="category-header"><i class="fas fa-coffee"></i> الكافيه والمشروبات</h2>
            <div class="menu-grid">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400" class="item-img" alt="قهوة">
                    <div class="item-title">قهوة تركية فاخرة</div>
                    <div class="item-price">2,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('قهوة تركية فاخرة', 2000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400" class="item-img" alt="عصير">
                    <div class="item-title">عصير برتقال طازج</div>
                    <div class="item-price">3,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('عصير برتقال طازج', 3000)">+ إضافة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar" onclick="toggleCartModal()">
        <div class="cart-info">
            <div class="cart-icon-wrapper">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
            <div>
                <div class="total-label">اضغط لتعديل الطلبات</div>
                <div class="total-amount" id="total-price">0 د.ع</div>
            </div>
        </div>
        <button class="btn-order" onclick="event.stopPropagation(); sendWhatsApp()"><i class="fab fa-whatsapp"></i> إرسال الطلب</button>
    </div>

    <!-- نافذة تعديل الطلبات تفاعلياً -->
    <div class="cart-modal" id="cartModal" onclick="toggleCartModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-list-ul"></i> قائمة طلباتك</h3>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            <div id="cartItemsContainer">
                <p style="text-align:center; color: var(--text-muted); padding: 20px;">السلة فارغة حالياً</p>
            </div>
        </div>
    </div>

    <script>
        let cart = {};
        const phoneNumber = "9647776651117"; // اكتب رقم الواتساب هنا

        function addToCart(name, price) {
            if (cart[name]) {
                cart[name].qty += 1;
            } else {
                cart[name] = { price: price, qty: 1 };
            }
            updateCartUI();
        }

        function changeQty(name, delta) {
            if (cart[name]) {
                cart[name].qty += delta;
                if (cart[name].qty <= 0) {
                    delete cart[name];
                }
            }
            updateCartUI();
        }

        function removeItem(name) {
            delete cart[name];
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0;
            let count = 0;
            let container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';

            let keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 20px;">السلة فارغة حالياً</p>';
            } else {
                keys.forEach(name => {
                    let item = cart[name];
                    let itemTotal = item.price * item.qty;
                    total += itemTotal;
                    count += item.qty;

                    container.innerHTML += `
                        <div class="cart-item-row">
                            <div>
                                <div style="font-weight:bold; color: var(--text-light);">${name}</div>
                                <div style="font-size:0.8rem; color: var(--gold-primary);">${itemTotal.toLocaleString()} د.ع</div>
                            </div>
                            <div class="item-controls">
                                <button class="qty-btn" onclick="changeQty('${name}', -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty('${name}', 1)">+</button>
                                <button class="delete-btn" onclick="removeItem('${name}')"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('total-price').innerText = total.toLocaleString() + ' د.ع';
            document.getElementById('cart-count').innerText = count;
        }

        function toggleCartModal() {
            let modal = document.getElementById('cartModal');
            modal.classList.toggle('active');
        }

        function sendWhatsApp() {
            let keys = Object.keys(cart);
            if(keys.length === 0) {
                alert("السلة فارغة! اختر بعض الوجبات أولاً.");
                return;
            }
            let total = 0;
            let message = "👑 *طلب جديد من موقع مطعم وكافيه ابن تايه* 👑\n\n";
            keys.forEach((name) => {
                let item = cart[name];
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                message += `• ${name} (العدد: ${item.qty}) - ${itemTotal.toLocaleString()} د.ع\n`;
            });
            message += `\n💰 *المجموع الكلي:* ${total.toLocaleString()} د.ع`;
            
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
