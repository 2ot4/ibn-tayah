<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم وكافيه ابن تايه - Ibn Tayah</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #fcf6ba;
            --gold-dark: #aa7c11;
            --bg-dark: #070707;
            --card-bg: #121212;
            --card-border: rgba(212, 175, 55, 0.25);
            --text-light: #f8fafc;
            --text-muted: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            padding-bottom: 130px;
        }

        /* الهيدر الملكي الفخم */
        header { 
            background: rgba(15, 15, 15, 0.95); 
            backdrop-filter: blur(10px);
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--gold-primary); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .logo-title {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: var(--gold-primary);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .subtitle {
            color: var(--gold-light);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-top: 4px;
            opacity: 0.85;
        }

        /* شريط التنقل السريع بين الأقسام */
        .nav-categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 12px 15px;
            background: #111;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            scrollbar-width: none;
            position: sticky;
            top: 75px;
            z-index: 99;
        }
        .nav-categories::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-light);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: bold;
            border-color: var(--gold-light);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        .category-header {
            font-size: 1.35rem;
            color: var(--gold-primary);
            margin: 30px 0 15px;
            font-family: 'Amiri', serif;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* شبكة الكروت الكبيرة والمنسقة */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
        }

        .item-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 16px; 
            padding: 12px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
        }

        .img-wrapper {
            width: 100%;
            height: 115px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .item-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 0.4s;
        }

        .item-card:hover .item-img { transform: scale(1.08); }

        .item-title { 
            font-weight: 700; 
            margin-bottom: 4px; 
            font-size: 0.95rem; 
            color: var(--text-light);
        }

        .item-price { 
            color: var(--gold-primary); 
            font-weight: 800; 
            margin-bottom: 10px; 
            font-size: 0.9rem;
        }

        .btn-add { 
            background: transparent;
            color: var(--gold-primary); 
            border: 1px solid var(--gold-primary); 
            padding: 7px 12px; 
            border-radius: 25px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-add:active {
            background: var(--gold-primary);
            color: #000;
        }

        /* شريط السلة العائم الفخم */
        .cart-bar { 
            position: fixed; 
            bottom: 15px; 
            left: 15px; 
            right: 15px; 
            max-width: 770px;
            margin: 0 auto;
            background: rgba(18, 18, 18, 0.95); 
            backdrop-filter: blur(10px);
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--gold-primary); 
            border-radius: 50px;
            z-index: 100; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        .cart-info { display: flex; align-items: center; gap: 12px; }
        .cart-icon-wrapper { position: relative; color: var(--gold-primary); font-size: 1.4rem; }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
