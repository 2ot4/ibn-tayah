<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم وكافيه ابن تايه - Ibn Tayah</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --card-border: #262626;
            --text-light: #f5f5f5;
            --text-muted: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            padding-bottom: 100px;
            background-image: radial-gradient(circle at top, #1a1508 0%, #0a0a0a 70%);
        }

        /* الهيدر الملكي */
        header { 
            background: rgba(20, 20, 20, 0.85); 
            backdrop-filter: blur(10px);
            padding: 25px 15px 15px; 
            text-align: center; 
            border-bottom: 1px solid var(--gold-dark); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .logo-title {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--gold-light);
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* شريط الأقسام السريع */
        .categories-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px;
            scrollbar-width: none;
            max-width: 800px;
            margin: 0 auto;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-light);
            padding: 8px 18px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
            color: #000;
            font-weight: bold;
            border-color: var(--gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            color: var(--gold-primary);
            margin: 25px 0 15px;
            font-family: 'Amiri', serif;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 8px;
        }

        /* الشبكة والبطاقات */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
        }

        .item-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 16px; 
            padding: 12px; 
            text-align: center; 
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
        }

        .item-img { 
            width: 100%; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .item-title { 
            font-weight: 700; 
            margin-bottom: 4px; 
            font-size: 0.95rem; 
            color: var(--text-light);
        }

        .item-price { 
            color: var(--gold-primary); 
            font-weight: 800; 
            margin-bottom: 12px; 
            font-size: 0.9rem;
        }

        .btn-add { 
            background: transparent;
            color: var(--gold-primary); 
            border: 1px solid var(--gold-primary); 
            padding: 8px 12px; 
            border-radius: 25px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-add:active {
            transform: scale(0.95);
            background: var(--gold-primary);
            color: #000;
        }

        /* السلة الفاخرة */
        .cart-bar { 
            position: fixed; 
            bottom: 15px; 
            left: 15px; 
            right: 15px; 
            max-width: 770px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.95); 
            backdrop-filter: blur(12px);
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--gold-primary); 
            border-radius: 50px;
            z-index: 100; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.9), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .total-label { font-size: 0.85rem; color: var(--text-muted); }
        .total-amount { color: var(--gold-light); font-weight: 900; font-size: 1.1rem; }

        .btn-order { 
            background: linear-gradient(135deg, #25d366, #128c7e); 
            color: white; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">مطعم وكافيه ابن تايه</h1>
        <p class="subtitle">بغداد • LUXURY MENU</p>
    </header>

    <!-- أزرار الأقسام -->
    <div class="categories-nav">
        <button class="cat-btn active" onclick="scrollToCat('meals')">الوجبات</button>
        <button class="cat-btn" onclick="scrollToCat('drinks')">الكافيه والمشروبات</button>
        <button class="cat-btn" onclick="scrollToCat('desserts')">الحلويات</button>
    </div>

    <div class="container">
        <!-- قسم الوجبات -->
        <div id="meals">
            <h2 class="category-header"><i class="fas fa-crown"></i> الوجبات الرئيسية</h2>
            <div class="menu-grid">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=400" class="item-img" alt="قص لحم">
                    <div class="item-title">قص لحم عراقي</div>
                    <div class="item-price">8,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('قص لحم عراقي', 8000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" class="item-img" alt="برغر">
                    <div class="item-title">برغر لحم خاص</div>
                    <div class="item-price">6,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('برغر لحم خاص', 6000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=400" class="item-img" alt="شاورما">
                    <div class="item-title">شاورما دجاج</div>
                    <div class="item-price">5,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('شاورما دجاج', 5000)">+ إضافة</button>
                </div>
            </div>
        </div>

        <!-- قسم المشروبات -->
        <div id="drinks">
            <h2 class="category-header"><i class="fas fa-coffee"></i> الكافيه والمشروبات</h2>
            <div class="menu-grid">
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400" class="item-img" alt="قهوة">
                    <div class="item-title">قهوة تركية فاخرة</div>
                    <div class="item-price">2,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('قهوة تركية', 2000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400" class="item-img" alt="عصير">
                    <div class="item-title">عصير برتقال طازج</div>
                    <div class="item-price">3,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('عصير برتقال', 3000)">+ إضافة</button>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400" class="item-img" alt="شاي">
                    <div class="item-title">شاي عراقي مهيل</div>
                    <div class="item-price">1,000 د.ع</div>
                    <button class="btn-add" onclick="addToCart('شاي عراقي', 1000)">+ إضافة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar">
        <div>
            <div class="total-label">المجموع الكلي</div>
            <div class="total-amount" id="total-price">0 د.ع</div>
        </div>
        <button class="btn-order" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> إرسال الطلب</button>
    </div>

    <script>
        let cart = [];
        let total = 0;
        
        // ضع رقمك هنا مع الرمز الدولي للعراق (مثال: 9647700000000)
        const phoneNumber = "9647700000000"; 

        function addToCart(name, price) {
            cart.push({name, price});
            total += price;
            document.getElementById('total-price').innerText = total.toLocaleString() + ' د.ع';
        }

        function scrollToCat(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function sendWhatsApp() {
            if(cart.length === 0) {
                alert("السلة فارغة! اختر بعض الوجبات أولاً.");
                return;
            }
            let message = "👑 *طلب جديد من موقع مطعم وكافيه ابن تايه* 👑\n\n";
            cart.forEach((item, index) => {
                message += `• ${item.name} - ${item.price.toLocaleString()} د.ع\n`;
            });
            message += `\n💰 *المجموع الكلي:* ${total.toLocaleString()} د.ع`;
            
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
